name: World Model Patch Cron

on:
  schedule:
    # Runs daily at 23:50 UTC to capture the complete day
    - cron: '50 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Execute World-Model Synthesizer
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
        run: |
          python3 ingest_world.py

      - name: Commit and push updates
        run: |
          git config user.name "world-patch-bot[bot]"
          git config user.email "world-patch-bot@users.noreply.github.com"
          git add -A data/
          
          if git diff --staged --quiet; then
            echo "No world state shifts today. Skipping commit."
          else
            git commit -m "chore(patch): publish daily world-model context sync [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
